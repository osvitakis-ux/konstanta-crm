<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js', {scope: './'})
      .then(function(reg){
        console.log('SW registered');
        // Перевіряємо оновлення одразу і кожні 15 хвилин (для довго відкритих вкладок)
        reg.update();
        setInterval(function(){ reg.update(); }, 15*60*1000);
      })
      .catch(function(e){ console.warn('SW error:', e); });

    // Коли новий воркер перебрав контроль — один раз перезавантажуємо сторінку,
    // щоб користувач одразу отримав нову версію без ручного оновлення
    var _reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(_reloaded) return;
      _reloaded = true;
      window.location.reload();
    });
  });
}
</script>

<style>
:root{
  /* Konstanta — світла тема */
  --bg:#f0f4f8;--s1:#ffffff;--s2:#f5f7fa;--s3:#edf0f5;
  --b1:#dde3ed;--b2:#c8d0de;

  --god:#2e3192;--god2:#5b60d4;--god-bg:rgba(46,49,146,.08);
  --dir:#a08800;--dir2:#c4a800;--dir-bg:rgba(192,160,0,.1);
  --adm:#0e86c0;--adm2:#1a9fd4;--adm-bg:rgba(14,134,192,.1);
  --tut:#1a9460;--tut2:#22b573;--tut-bg:rgba(26,148,96,.1);

  --danger:#d93025;--warn:#e67e22;
  --t1:#1a2233;--t2:#4a5568;--t3:#8a96a8;--t4:#c8d0de;
  --radius:10px;--shadow:0 4px 20px rgba(0,0,0,.1);

  --logo-yellow:#d9e021;--logo-blue:#29abe2;--logo-dark:#2e3192;
}

[data-theme="dark"]{
  --bg:#0f1117;--s1:#1a1d27;--s2:#22263a;--s3:#2a2e42;
  --b1:#2e3350;--b2:#3a4060;

  --god:#7b82f0;--god2:#9da3f8;--god-bg:rgba(123,130,240,.12);
  --dir:#e6c84a;--dir2:#f0d860;--dir-bg:rgba(230,200,74,.12);
  --adm:#29abe2;--adm2:#3dbff8;--adm-bg:rgba(41,171,226,.12);
  --tut:#22b573;--tut2:#2ed88a;--tut-bg:rgba(34,181,115,.12);

  --danger:#f87171;--warn:#fb923c;
  --t1:#e8eaf0;--t2:#9aa0b8;--t3:#5a6080;--t4:#3a4060;
  --shadow:0 4px 20px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Karla',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow:hidden}

/* ─── LOGIN ─── */
#ls{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:1000}
#ls::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 30% 50%,rgba(41,171,226,.07),transparent),radial-gradient(ellipse 40% 60% at 70% 30%,rgba(217,224,33,.05),transparent);pointer-events:none}
.lc{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:44px 40px;width:420px;box-shadow:var(--shadow),0 0 60px rgba(41,171,226,.06);animation:su .3s ease;position:relative;overflow:hidden}
.lc::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:2px;background:linear-gradient(90deg,var(--logo-yellow),var(--logo-blue));border-radius:2px}
.ll{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.li{width:42px;height:42px;background:linear-gradient(135deg,var(--logo-yellow),var(--logo-blue));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.lt{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.5px}
.ls2{font-size:10px;color:var(--t3);letter-spacing:2px;text-transform:uppercase}
.lh{font-size:15px;font-weight:600;margin-bottom:4px}
.lsub{font-size:13px;color:var(--t2);margin-bottom:26px}
.lf{display:flex;flex-direction:column;gap:12px}
.lfl{font-size:11px;color:var(--t2);font-weight:600;letter-spacing:.4px;margin-bottom:5px;text-transform:uppercase}
.lfi{background:var(--s2);border:1px solid var(--b1);border-radius:var(--radius);color:var(--t1);padding:11px 14px;font-size:13.5px;font-family:'Karla',sans-serif;outline:none;transition:border .15s;width:100%}
.lfi:focus{border-color:var(--adm)}
.lb{background:linear-gradient(135deg,var(--logo-dark),var(--logo-blue));color:#fff;border:none;border-radius:var(--radius);padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;letter-spacing:.3px;transition:opacity .15s;margin-top:4px}
.lb:hover{opacity:.88}
.le{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--danger);display:none;margin-top:2px}
.la{margin-top:22px;padding-top:18px;border-top:1px solid var(--b1)}
.lat{font-size:10px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.dc{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--s2);border:1px solid var(--b1);font-size:12px;color:var(--t2);cursor:pointer;margin:3px;transition:.15s;font-family:'Karla',sans-serif}
.dc:hover{border-color:var(--adm);color:var(--adm);background:var(--adm-bg)}
.dc.god-chip{border-color:rgba(46,49,146,.4);color:var(--god2)}
.dc.god-chip:hover{background:var(--god-bg);border-color:var(--god2)}

/* ─── APP ─── */
#as{display:none;height:100vh;overflow:hidden}
.layout{display:flex;height:100vh}

/* ─── SIDEBAR ─── */
.sb{width:224px;height:100vh;background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.sblogo{padding:20px 18px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px;position:relative}
.sblogo::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--logo-yellow),var(--logo-blue),transparent)}
.sbli{width:32px;height:32px;background:linear-gradient(135deg,var(--logo-yellow),var(--logo-blue));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sblt{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.5px}
.sbls{font-size:9px;color:var(--t3);letter-spacing:2px;text-transform:uppercase}
nav.sbnav{flex:1;overflow-y:auto;padding:10px 8px}
.nsec{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--t4);padding:10px 10px 5px;font-weight:600}
.ni{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--t2);transition:all .15s;margin-bottom:1px;position:relative}
.ni:hover{background:var(--s2);color:var(--t1)}
.ni.active{color:var(--t1);background:var(--s3);border-left:2.5px solid var(--adm)}
.ni.active.god{border-left-color:var(--god2);color:var(--god2)}
.ni.active.dir{border-left-color:var(--dir);color:var(--dir)}
.ni.active.tut{border-left-color:var(--tut2);color:var(--tut2)}
.nico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;background:var(--adm);color:#fff;font-size:9px;border-radius:10px;padding:2px 6px;font-family:'JetBrains Mono',monospace;font-weight:500}

.sbfoot{padding:12px;border-top:1px solid var(--b1)}
.ucard{display:flex;align-items:center;gap:9px}
.uav{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;font-family:'Syne',sans-serif}
.uname{font-size:12.5px;font-weight:600;line-height:1.3}
.rpill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px;font-family:'Syne',sans-serif}
.rpill.god{background:var(--god-bg);color:var(--god2);border:1px solid rgba(91,96,212,.25)}
.rpill.director{background:rgba(217,224,33,.18);color:#8a8f00;border:1px solid rgba(217,224,33,.35)}
.rpill.admin{background:var(--adm-bg);color:var(--adm);border:1px solid rgba(41,171,226,.25)}
.rpill.tutor{background:var(--tut-bg);color:var(--tut);border:1px solid rgba(34,181,115,.25)}
.logoutbtn{margin-left:auto;background:none;border:none;color:var(--t3);cursor:pointer;font-size:17px;padding:4px;transition:.15s;border-radius:6px}
.logoutbtn:hover{color:var(--danger);background:rgba(248,113,113,.1)}

/* ─── MAIN ─── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--s1);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0}
.ptitle{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;flex:1;letter-spacing:-.3px}
.search{display:flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:6px 12px;width:210px}
.search input{background:none;border:none;outline:none;color:var(--t1);font-size:13px;width:100%;font-family:'Karla',sans-serif}
.search input::placeholder{color:var(--t3)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:'Karla',sans-serif;transition:all .15s;white-space:nowrap}
.btn-p{background:var(--adm);color:#fff}
.btn-p:hover{background:#1a8fc7}
.btn-g{background:transparent;border:1px solid var(--b1);color:var(--t2)}
.btn-g:hover{background:var(--s2);color:var(--t1)}
.btn-d{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3);color:var(--danger)}
.btn-sm{padding:4px 9px;font-size:12px}
.btn-god{background:linear-gradient(135deg,var(--god),var(--god2));color:#fff}
.content{flex:1;overflow-y:auto;padding:22px}
@keyframes su{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}to{opacity:1;transform:translateY(0)}}

/* ─── PAGES ─── */
.page{display:none!important}
.page.active{display:block!important;animation:fi .15s ease forwards}

/* ─── CARDS ─── */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.sc{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px}
.sc.blue::before{background:linear-gradient(90deg,var(--adm),var(--adm2))}
.sc.green::before{background:linear-gradient(90deg,var(--tut),var(--tut2))}
.sc.yellow::before{background:linear-gradient(90deg,var(--logo-yellow),var(--logo-blue))}
.sc.red::before{background:linear-gradient(90deg,var(--logo-dark),var(--god2))}
.slbl{font-size:10px;color:var(--t2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;font-weight:600}
.sval{font-size:26px;font-weight:800;font-family:'Syne',sans-serif;letter-spacing:-1px}
.ssub{font-size:11px;color:var(--t3);margin-top:3px}
.sico{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:26px;opacity:.12}
.card{background:var(--s1);border:1px solid var(--b1);border-radius:14px;overflow:hidden}
.ch{padding:14px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px}
.ct{font-size:14px;font-weight:700;flex:1;font-family:'Syne',sans-serif;letter-spacing:-.2px}
table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--t3);padding:10px 16px;text-align:left;background:var(--s2);border-bottom:1px solid var(--b1);font-weight:700}
td{padding:11px 16px;font-size:13px;border-bottom:1px solid var(--b1)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bg{background:rgba(52,211,153,.15);color:var(--tut)}
.bb{background:rgba(108,143,255,.15);color:var(--adm)}
.by{background:rgba(245,158,11,.15);color:var(--dir)}
.br{background:rgba(248,113,113,.15);color:var(--danger)}
.bp{background:rgba(167,139,250,.15);color:#a78bfa}
.bn{background:rgba(148,163,184,.18);color:#64748b}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;flex-shrink:0;font-family:'Syne',sans-serif}

/* ─── MODAL ─── */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.mo.open{display:flex}
.mdl{background:var(--s1);border:1px solid var(--b2);border-radius:18px;width:560px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:su .2s ease}
.mdlh{padding:20px 24px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between}
.mdlt{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.3px}
.mdlb{padding:22px 24px;overflow-y:auto;flex:1}
.mdlf{padding:14px 24px;border-top:1px solid var(--b1);display:flex;gap:8px;justify-content:flex-end}
.xbtn{background:none;border:none;color:var(--t2);cursor:pointer;font-size:20px;line-height:1;border-radius:6px;padding:2px 6px;transition:.15s}
.xbtn:hover{color:var(--t1);background:var(--s3)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgr{display:flex;flex-direction:column;gap:5px}
.fgr.full{grid-column:1/-1}
label{font-size:11px;color:var(--t2);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
input,select,textarea{background:var(--s2);border:1px solid var(--b1);border-radius:8px;color:var(--t1);padding:9px 12px;font-size:13px;font-family:'Karla',sans-serif;outline:none;transition:border .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--adm)}
select option{background:var(--s2)}
textarea{resize:vertical;min-height:72px}
.nbadge{margin-left:auto;background:var(--adm);color:#fff;font-size:9px;border-radius:10px;padding:2px 6px;font-family:'JetBrains Mono',monospace;font-weight:500}

/* ─── SCHEDULE ─── */
.schg{display:grid;grid-template-columns:72px repeat(7,1fr);border:1px solid var(--b1);border-radius:14px}
.schh{background:var(--s2);padding:9px;text-align:center;font-size:11px;font-weight:700;border-bottom:1px solid var(--b1);border-right:1px solid var(--b1);font-family:'Syne',sans-serif;letter-spacing:.3px}
.scht{padding:7px 6px;font-size:10px;color:var(--t3);text-align:right;border-right:1px solid var(--b1);border-bottom:1px solid var(--b1);background:var(--s1);font-family:'JetBrains Mono',monospace}
.schc{border-right:1px solid var(--b1);border-bottom:1px solid var(--b1);min-height:46px;position:relative;cursor:pointer;transition:.1s}
.schc:hover{background:rgba(108,143,255,.04)}
.sche{border-radius:5px;padding:3px 5px;font-size:10px;cursor:pointer;overflow:hidden;z-index:1;margin-bottom:2px}
.qp-btn:hover{background:var(--s2)!important}
.ec-done{background:rgba(34,197,94,.18);border-left:3px solid #22c55e;color:#16a34a}
.ec-testing{background:rgba(20,184,166,.18);border-left:3px solid #14b8a6;color:#0d9488}
/* ── Журнал дзвінків ── */
.tel-inp{font-size:12px;padding:5px 9px;border:1px solid var(--b1);border-radius:8px;background:var(--s2);color:var(--t1);outline:none;transition:.15s;width:auto!important;flex:0 0 auto!important;max-width:220px}
.tel-inp:focus{border-color:var(--adm);background:var(--s1)}
.tel-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10.5px;white-space:nowrap;background:var(--s2);color:var(--t3)}
.tel-pill #tel-status-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);display:inline-block;flex-shrink:0}
.tel-sum-item{display:flex;align-items:center;gap:5px;color:var(--t2)}
.tel-sum-item b{font-size:13px;font-family:'JetBrains Mono',monospace}
.tel-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tel-tbl th{text-align:left;padding:9px 12px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--b1);white-space:nowrap;background:var(--s2);position:sticky;top:0;z-index:1}
.tel-tbl th.sortable{cursor:pointer;user-select:none;transition:.15s}
.tel-tbl th.sortable:hover{color:var(--adm)}
.tel-tbl th .sort-ico{opacity:.35;margin-left:3px;font-size:9px}
.tel-tbl th.sorted .sort-ico{opacity:1;color:var(--adm)}
.tel-tbl td{padding:9px 12px;border-bottom:1px solid var(--b1);vertical-align:middle}
.tel-tbl tbody tr{transition:background .12s}
.tel-tbl tbody tr:hover{background:var(--s2)}
.tel-dir{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tel-dir-in{color:#16a34a}
.tel-dir-out{color:#2563eb}
.tel-dir-miss{color:#dc2626}
.tel-num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--adm);text-decoration:none;white-space:nowrap}
.tel-num:hover{text-decoration:underline}
.tel-who{font-size:12.5px}
.tel-who-lead{color:#8b5cf6;font-weight:600}
/* ── Таймлайн аналітики ── */
.an-lg-row:hover{background:var(--s2)}
.rc-tl-bars{display:flex;gap:4px;align-items:flex-end;height:60px}
.rc-tl-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;position:relative;min-width:0;height:100%}
.rc-tl-bar .fill{width:100%;background:var(--b1);border-radius:4px 4px 0 0;transition:.18s;min-height:3px}
.rc-tl-bar:hover .fill{background:var(--adm2)}
.rc-tl-bar.cur .fill{background:var(--adm)}
.rc-tl-bar.fut .fill{opacity:.4}
.rc-tl-bar .lb{font-size:9px;color:var(--t3);margin-top:4px;white-space:nowrap;
  line-height:1;background:none!important;border:none!important;padding:0!important;
  border-radius:0!important;box-shadow:none!important;flex:0 0 auto}
.rc-tl-bar.cur .lb{color:var(--adm);font-weight:700}
.rc-tl-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--t1);color:var(--s1);font-size:10px;padding:3px 7px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:5}
.rc-tl-bar:hover .rc-tl-tip{opacity:1}
/* Мінімальні ширини — щоб колонки не тиснулись і не обрізались */
.tel-tbl{min-width:820px}
.tel-tbl th:nth-child(1),.tel-tbl td:nth-child(1){min-width:110px}
.tel-tbl th:nth-child(2),.tel-tbl td:nth-child(2){min-width:140px}
.tel-tbl th:nth-child(3),.tel-tbl td:nth-child(3){min-width:150px}
.tel-tbl th:nth-child(4),.tel-tbl td:nth-child(4){min-width:95px;text-align:right}
.tel-tbl th:nth-child(5),.tel-tbl td:nth-child(5){min-width:90px}
.tel-tbl th:nth-child(6),.tel-tbl td:nth-child(6){min-width:120px}

.tkpi{width:100%;border-collapse:collapse;font-size:13px}
.tkpi th{padding:8px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--b1);white-space:nowrap;cursor:help}
.tkpi td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.tkpi tbody tr:hover td{background:rgba(255,255,255,.02)}
.tkpi tbody tr:last-child td{border-bottom:none}
.mini-bar{height:4px;background:var(--b2);border-radius:4px;margin-top:4px;width:80px}
.mini-fill{height:4px;border-radius:4px;transition:width .4s ease}
.comm-add-btn{background:var(--adm-bg);border:1px solid rgba(41,171,226,.3);color:var(--adm);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;font-weight:700;transition:.15s}
.comm-add-btn:hover{background:var(--adm);color:#fff}
/* Trend mini-charts */
.trend-chart{display:flex;align-items:flex-end;gap:6px;height:80px;padding:4px 0}
.trend-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.trend-bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .3s ease}
.trend-weeks{display:flex;gap:4px;padding:8px 0 4px;overflow:hidden}
.trend-week{flex:1;min-width:0;max-width:25%;display:flex;flex-direction:column;align-items:center;gap:3px}
.trend-week-now .trend-week-lbl{color:var(--adm);font-weight:700}
.trend-week-val{font-size:11px;font-weight:700;color:var(--t1);font-family:'JetBrains Mono',monospace}
.trend-week-bar-wrap{width:100%;height:6px;background:var(--b1);border-radius:3px;overflow:hidden}
.trend-week-bar{height:100%;border-radius:3px;min-width:4px;transition:width .4s ease}
.trend-week-lbl{font-size:8px;color:var(--t3);font-family:'JetBrains Mono',monospace;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.trend-tutor-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.trend-tutor-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--b1);overflow:hidden}
.trend-tutor-name{font-size:11px;color:var(--t2);min-width:120px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.trend-tutor-bars{display:flex;flex:1;gap:4px;align-items:center}
.trend-tutor-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.trend-tutor-num{font-size:10px;font-weight:600;color:var(--t2);font-family:'JetBrains Mono',monospace}
.trend-tutor-bar-wrap{width:100%;height:4px;background:var(--b1);border-radius:2px;overflow:hidden}
.trend-tutor-bar{height:100%;border-radius:2px;min-width:2px;transition:width .4s ease}
.trend-tutor-total{font-size:12px;font-weight:700;color:var(--t1);min-width:24px;text-align:right;font-family:'JetBrains Mono',monospace}
.trend-lbl{font-size:9px;color:var(--t3);font-family:JetBrains Mono,monospace;white-space:nowrap}
.trend-val{font-size:10px;color:var(--t2);font-weight:600;font-family:JetBrains Mono,monospace}
.tutor-trend-row{display:flex;gap:4px;align-items:center}
/* Communications */
.comm-log{display:flex;flex-direction:column;gap:8px}
.comm-item{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:8px 12px;display:flex;align-items:flex-start;gap:8px;transition:border-color .15s}.comm-item:hover{border-color:var(--adm)}
.comm-ico{font-size:18px;flex-shrink:0;margin-top:1px}
.comm-body{flex:1;min-width:0}
.comm-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.comm-type{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--adm-bg);color:var(--adm);text-transform:uppercase;letter-spacing:.4px}
.comm-tutor{font-size:12px;font-weight:600;color:var(--t1)}
.comm-date{font-size:10px;color:var(--t3);font-family:JetBrains Mono,monospace;margin-left:auto}
.comm-note{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


/* ─── PER-USER ACCESS EDITOR ─── */
.ua-modal{max-width:700px !important}
.ua-tabs{display:flex;gap:0;border-bottom:1px solid var(--b1);margin-bottom:16px}
.ua-tab{padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;transition:.15s;font-family:'Syne',sans-serif;margin-bottom:-1px;letter-spacing:.3px;text-transform:uppercase}
.ua-tab:hover{color:var(--t1)}.ua-tab.active{color:var(--adm);border-bottom-color:var(--adm)}
.ua-panel{display:none}.ua-panel.active{display:block}
.ua-perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.ua-perm-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;transition:.12s}
.ua-perm-row:hover{background:var(--s2)}
.ua-perm-label{font-size:12px;color:var(--t2)}
.ua-nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ua-nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;cursor:pointer;transition:.15s;user-select:none}
.ua-nav-item:hover{border-color:var(--adm)}.ua-nav-item.checked{border-color:var(--adm);background:rgba(41,171,226,.09)}
.ua-nav-item input{accent-color:var(--adm);cursor:pointer;width:14px;height:14px;flex-shrink:0}
.ua-nav-ico{font-size:16px}.ua-nav-lbl{font-size:12px;font-weight:600;flex:1}
.ua-nav-sec{font-size:10px;color:var(--t3)}
.ulr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--b1);transition:.12s}
.ulr:last-child{border-bottom:none}.ulr:hover{background:rgba(255,255,255,.015)}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:22px;right:22px;background:var(--s1);border:1px solid var(--b1);box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:10px;padding:11px 16px;display:flex;align-items:center;gap:9px;font-size:13px;box-shadow:var(--shadow);z-index:999;animation:fi .2s ease}
.toast.success{border-color:rgba(52,211,153,.4)}
.toast.error{border-color:rgba(248,113,113,.4)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:10px}

.active-view{background:var(--adm)!important;color:#fff!important;border-color:var(--adm)!important}
.sche-tutor{font-size:10px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ═══════════════════════════════════
   MOBILE RESPONSIVE ≤768px
   ═══════════════════════════════════ */
.hamburger{display:none;position:fixed;top:10px;left:10px;z-index:400;
  width:38px;height:38px;background:var(--s1);border:1px solid var(--b1);
  border-radius:9px;align-items:center;justify-content:center;cursor:pointer;
  font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199}

@media(max-width:768px){
  /* hamburger visible */
  .hamburger{display:flex}

  /* CRM columns: shorter height to fit mobile viewport with usable scroll */
  .crm-col{height:60vh!important;width:220px!important}

  /* sidebar: slide in from left */
  .sb{position:fixed!important;top:0;left:0;bottom:0;z-index:200;
      width:260px!important;transform:translateX(-100%);
      transition:transform .25s ease;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  .sb.open{transform:translateX(0)}
  .sb-overlay.open{display:block}

  /* main: full width, offset for hamburger */
  .layout{flex-direction:column}
  .main{width:100%;min-width:0}
  .topbar{padding-left:58px;padding-right:12px;min-height:48px}
  #ptitle{font-size:14px}
  #addbtn{font-size:12px;padding:6px 12px}

  /* content */
  .content{padding:12px}

  /* stat grids */
  .sgrid{grid-template-columns:1fr 1fr!important;gap:10px}
  .kpi-grid{grid-template-columns:1fr 1fr!important}
  .tc{grid-template-columns:1fr!important;gap:10px}
  [style*="grid-template-columns:1fr 1.4fr 1fr"]{grid-template-columns:1fr!important;gap:10px}

  /* tables: horizontal scroll */
  .card{overflow-x:hidden}
  .card table, .card .tkpi{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%}

  /* modals: bottom sheet */
  .mo{align-items:flex-end!important}
  .mdl{width:100vw!important;max-width:100vw!important;min-width:0!important;border-radius:18px 18px 0 0!important;max-height:88vh;margin:0!important;overflow-y:auto;box-sizing:border-box!important}

  /* forms: single column */
  .fg{grid-template-columns:1fr!important}
  .fgr.full,.fgr{grid-column:1!important}

  /* filters */
  .filters{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;
            padding-bottom:8px}
  .chip{white-space:nowrap}

  /* schedule */
  .schg{min-width:550px}
  #pg-schedule .card{overflow-x:auto}

  /* users list */
  .ulr{flex-wrap:wrap;gap:6px}
  .ulr>div:last-child{width:100%;margin-left:0!important;justify-content:flex-start}

  /* settings grid */
  .tc>*{min-width:0}

  /* UA modal */
  .ua-nav-grid{grid-template-columns:1fr 1fr!important}
  .ua-perm-grid{grid-template-columns:1fr!important}

  /* login */
  .lc{width:calc(100vw - 24px)!important;padding:28px 18px!important}

  /* KPI table */
  #dash-tutor-kpi{font-size:11px}
  #dash-tutor-kpi td,#dash-tutor-kpi th{padding:7px 8px}

  /* pricing rules form */
  #pricing-rules-list .ms{flex-wrap:wrap}
}

@media(max-width:420px){
  .sgrid{grid-template-columns:1fr!important}
  .kpi-grid{grid-template-columns:1fr!important}
  .sval{font-size:22px!important}
  .topbar{padding-left:54px}
}

/* === MOBILE EXTRA FIXES === */
@media(max-width:768px){
  /* Ensure hamburger is always visible and clickable */
  .hamburger{
    display:flex!important;
    z-index:500!important;
    position:fixed!important;
  }
  /* Sidebar overlay above content but below sidebar */
  .sb-overlay{z-index:490!important}
  /* Sidebar above overlay */
  .sb{z-index:500!important}
  /* Prevent body scroll when sidebar open */
  body.sb-open{overflow:hidden}
  /* Modal fixes for mobile */
  .mdl{width:100vw!important;max-width:100vw!important;min-width:0!important;margin:0!important;border-radius:18px 18px 0 0!important;max-height:90vh;overflow-y:auto;box-sizing:border-box!important}
  .mo{align-items:flex-end!important}
  /* Fix tables on mobile */
  table{font-size:12px}
  td,th{padding:8px 10px!important}
  /* Fix content padding */
  .content{padding:10px!important}
  /* Fix topbar */
  .topbar{padding:0 8px 0 58px!important;gap:6px!important}
}

/* Червона підсвітка пункту "Завдання" у відповідального з простроченими завданнями */
.ni-task-alert { background: rgba(248,113,113,.16) !important; color: var(--danger) !important; animation: taskpulse 1.3s ease-in-out infinite; }
@keyframes taskpulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(248,113,113,.45);} 50%{ box-shadow: 0 0 0 5px rgba(248,113,113,0);} }

.pr-bar{display:flex;height:7px;border-radius:20px;overflow:hidden;margin:10px 0 4px;background:var(--s3)}
